<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Withdraw | Ziba</title>

<link
    rel="stylesheet"
    href="./css/withdraw.css"
>

</head>

<body>

<div class="withdraw-container">

    <h1>
        Withdraw Funds
    </h1>

    <p>
        Available Balance
    </p>

    <h2 id="balance">
        ₦0
    </h2>


    <form id="withdrawForm">

        <label>
            Amount
        </label>

        <input
            type="number"
            id="amount"
            placeholder="Enter amount"
            min="100"
            required
        >


        <label>
            Bank
        </label>

        <select id="bankCode" required>

            <option value="">
                Select Bank
            </option>

            <option value="058">
                GTBank
            </option>

            <option value="033">
                UBA
            </option>

            <option value="044">
                Access Bank
            </option>

            <option value="011">
                First Bank
            </option>

            <option value="057">
                Zenith Bank
            </option>

        </select>


        <label>
            Account Number
        </label>

        <input
            type="text"
            id="accountNumber"
            maxlength="10"
            placeholder="10-digit account number"
            required
        >


        <button type="submit">
            Withdraw
        </button>

    </form>

</div>


<script
    type="module"
    src="./js/withdraw.js"
></script>

</body>

</html>
