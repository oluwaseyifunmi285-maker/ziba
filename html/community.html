
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ziba Community</title>

    <link rel="stylesheet"
          href="./css/community.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<!-- ================= TOP NAVIGATION ================= -->

<header class="top-header">

    <a href="seller-dashboard.html"
       class="logo">

        ZIBA

    </a>


    <nav class="main-nav">


        <a href="seller-dashboard.html">

            <i class="fas fa-home"></i>

            <span>Home</span>

        </a>


        <a href="marketplace.html">

            <i class="fas fa-store"></i>

            <span>Marketplace</span>

        </a>


        <a href="community.html"
           class="active">

            <i class="fas fa-users"></i>

            <span>Community</span>

        </a>


        <a href="chat.html">

            <i class="fas fa-comments"></i>

            <span>Messages</span>

        </a>


        <a href="manage-products.html">

            <i class="fas fa-box"></i>

            <span>Products</span>

        </a>


        <a href="seller-orders.html">

            <i class="fas fa-receipt"></i>

            <span>Orders</span>

        </a>


        <a href="create-post.html">

            <i class="fas fa-plus-circle"></i>

            <span>Create Post</span>

        </a>


    </nav>


    <div class="header-actions">


        <a href="upgrade.html"
           class="upgrade-link">

            <i class="fas fa-crown"></i>

            Upgrade

        </a>


        <a href="profile.html"
           class="profile-link">

            <img id="sellerProfileImage"
                 src=""
                 alt="Profile">

            <i id="sellerProfileIcon"
               class="fas fa-user">
            </i>

        </a>


    </div>

</header>



<!-- ================= MAIN ================= -->

<main class="community-main">


    <!-- ================= HEADER ================= -->

    <section class="community-header">

        <div>

            <h1>

                Ziba Community

            </h1>

            <p>

                Discover products, experiences and stories from the Ziba community.

            </p>

        </div>


        <a href="create-post.html"
           class="create-post-btn">

            <i class="fas fa-plus"></i>

            Create Post

        </a>

    </section>



    <!-- ================= POST FILTERS ================= -->

    <section class="post-filters">


        <button class="filter-btn active"
                data-filter="all">

            All

        </button>


        <button class="filter-btn"
                data-filter="product">

            <i class="fas fa-box"></i>

            Products

        </button>


        <button class="filter-btn"
                data-filter="experience">

            <i class="fas fa-comment"></i>

            Experiences

        </button>


        <button class="filter-btn"
                data-filter="general">

            <i class="fas fa-bullhorn"></i>

            General

        </button>


    </section>



    <!-- ================= COMMUNITY FEED ================= -->

  <section class="community-feed"
         id="communityFeed">

        <div class="loading">

            <i class="fas fa-spinner fa-spin"></i>

            <p>

                Loading community posts...

            </p>

        </div>


    </section>


</main>



<!-- ================= MOBILE NAV ================= -->

<nav class="mobile-nav">


    <a href="seller-dashboard.html">

        <i class="fas fa-home"></i>

        <span>Home</span>

    </a>


    <a href="marketplace.html">

        <i class="fas fa-store"></i>

        <span>Market</span>

    </a>


    <a href="community.html"
       class="active">

        <i class="fas fa-users"></i>

        <span>Community</span>

    </a>


    <a href="chat.html">

        <i class="fas fa-comments"></i>

        <span>Chat</span>

    </a>


    <a href="profile.html">

        <i class="fas fa-user"></i>

        <span>Profile</span>

    </a>


</nav>



<script type="module"
        src="./js/community.js">
</script>


</body>

</html>
```
