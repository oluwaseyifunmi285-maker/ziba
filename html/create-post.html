
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Post | Ziba</title>

    <link rel="stylesheet"
          href="./css/create-post.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="top-header">

    <a href="community.html"
       class="logo">

        ZIBA

    </a>


    <a href="community.html"
       class="back-btn">

        <i class="fas fa-arrow-left"></i>

        Community

    </a>

</header>



<!-- ================= MAIN ================= -->

<main class="create-post-container">


    <section class="create-post-card">


        <div class="page-title">

            <div class="title-icon">

                <i class="fas fa-pen"></i>

            </div>

            <div>

                <h1>Create a Post</h1>

                <p>
                    Share something with the Ziba community.
                </p>

            </div>

        </div>



        <!-- ================= POST TYPE ================= -->

        <label class="section-label">

            What do you want to post?

        </label>


        <div class="post-types">


            <button
                type="button"
                class="post-type active"
                data-type="general">

                <i class="fas fa-bullhorn"></i>

                <strong>General</strong>

                <span>
                    Share thoughts, tips or announcements
                </span>

            </button>


            <button
                type="button"
                class="post-type"
                data-type="experience">

                <i class="fas fa-comment-dots"></i>

                <strong>Experience</strong>

                <span>
                    Share your Ziba experience
                </span>

            </button>


            <button
                type="button"
                class="post-type"
                data-type="product">

                <i class="fas fa-box"></i>

                <strong>Product</strong>

                <span>
                    Talk about a product
                </span>

            </button>


        </div>



        <!-- ================= FORM ================= -->

        <form id="createPostForm">


            <input
                type="hidden"
                id="postType"
                value="general"
            >


            <!-- TITLE -->

            <label for="title">

                Title

            </label>

            <input
                type="text"
                id="title"
                placeholder="Give your post a title"
                maxlength="100"
            >



            <!-- CONTENT -->

            <label for="content">

                Post

            </label>

            <textarea
                id="content"
                rows="7"
                maxlength="2000"
                placeholder="What would you like to share?"
                required
            ></textarea>


            <div class="character-count">

                <span id="characterCount">
                    0
                </span>
                / 2000

            </div>



            <!-- ================= PRODUCT ================= -->

            <div
                id="productSection"
                class="product-section hidden"
            >

                <label for="productSelect">

                    Select Product

                </label>


                <select id="productSelect">

                    <option value="">
                        Choose one of your products
                    </option>

                </select>


                <p class="field-help">

                    You can only attach products that you have posted on Ziba.

                </p>

            </div>



            <!-- ================= IMAGE ================= -->

            <label for="postImage">

                Add Image
                <span class="optional">
                    (Optional)
                </span>

            </label>


            <div class="image-upload">

                <input
                    type="file"
                    id="postImage"
                    accept="image/*"
                >


                <div class="upload-content">

                    <i class="fas fa-cloud-arrow-up"></i>

                    <strong>
                        Choose an image
                    </strong>

                    <span>
                        JPG, PNG or WEBP
                    </span>

                </div>

            </div>


            <div
                id="imagePreview"
                class="image-preview"
            ></div>



            <!-- ================= SUBMIT ================= -->

            <button
                type="submit"
                id="publishBtn"
                class="publish-btn"
            >

                <i class="fas fa-paper-plane"></i>

                Publish Post

            </button>


        </form>


    </section>


</main>



<script
    type="module"
    src="./js/create-post.js">
</script>


</body>

</html>
